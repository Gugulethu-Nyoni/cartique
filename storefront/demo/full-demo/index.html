<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Full Cartique Demo</title>
   
        
</head>
<body>
    <h1>🛍️ Full Cartique Demo</h1>
    <div class="demo-status">✅ Full storefront — check console</div>
    
    <div id="cartique"></div>

    <div class="debug-hint">
        🛠️ Console: <code>window.__storefront</code> or <code>window.__cartique</code>
    </div>

    <!-- Storefront Component Templates -->
    <div id="cartique-components" style="display:none;">
        <!-- Product Grid -->
        <div id="cartique-product-grid-component">
            <div class="cartique_product_card" id="cartique_product_card">
                <div id="cartique_product_image_container" class="cartique_product_image_container">
                    <a href="#"><img class="cartique_product_image" id="image" src="" alt="Product Name" /></a>
                </div>
                <div class="product-details-animate">
                    <h3 id="title" class="cartique_product_title">Product Title</h3>
                    <p id="description" class="cartique_product_description">Product Description</p>
                    <div class="currency-price-display">
                        <span>
                            <span id="currency" class="currency"></span>
                            <span id="price" class="cartique_product_price"></span>
                        </span>
                        <span>
                            <span id="sale_price_currency" class="currency"></span>
                            <span id="sale_price" class="cartique_saleprice_price"></span>
                        </span>
                    </div>
                    <div class="slide up">
                        <button class="cartique_add_to_cart">ADD TO CART</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Product List -->
        <div id="cartique-product-list-component">
            <div class="cartique_product_listings">
                <div class="cartique_product_listing" id="cartique_product_listing">
                    <div id="cartique_product_image_container" class="cartique_product_image_container">
                        <a href="#">
                            <img class="cartique_product_image" id="image" src="" alt="Product Name" />
                        </a>
                    </div>
                    <div class="product-details-animate">
                        <h3 id="title" class="cartique_product_title">Product Title</h3>
                        <p id="description" class="cartique_product_description">Product Description</p>
                        <div class="currency-price-display">
                            <span>
                                <span id="currency" class="currency"></span>
                                <span id="price" class="cartique_product_price"></span>
                            </span>
                            <span>
                                <span id="sale_price_currency" class="currency"></span>
                                <span id="sale_price" class="cartique_saleprice_price"></span>
                            </span>
                        </div>
                    </div>
                    <div class="slide up">
                        <button class="cartique_add_to_cart">ADD TO CART</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Cart Slider -->
        <div id="cartique-cart-slider-component">
            <div id="cart-slide" class="cart-slide">
                <button class="cart-close-btn" id="cart-close-btn">&times;</button>
                <div class="cart-header"><h2>Shopping Cart</h2></div>
                <div class="cart-items" id="cart-items">
                    <h5 class="shopping-cart-empty" id="shopping-cart-empty">Shopping Cart is Empty!</h5>
                    <div id="cart-items-container"></div>
                    <div class="cart-footer">
                        <div class="cart-subtotal">
                            <p>Subtotal: </p>
                            <p><span id="subtotal-currency"></span><span id="subtotal"></span></p>
                        </div>
                        <button class="cart-btn" id="view-cart-btn">View Cart</button>
                        <a href="#" id="checkout-url"><button class="cart-btn" id="checkout-btn">Checkout</button></a>
                    </div>
                </div>
            </div>
            <div id="cart-overlay" class="cart-overlay"></div>
        </div>

        <!-- Cart Item Component -->
        <div id="cartique-cart-item-component">
            <div class="cart-item">
                <div class="cart-item-row">
                    <div class="cart-item-thumbnail">
                        <img id="image" src="" alt="Product Image" />
                    </div>
                    <div class="cart-item-details">
                        <h6 id="title"></h6>
                        <div class="currency-price-display">
                            <span>
                                <span id="currency" class="currency"></span>
                                <span id="price" class="cartique_cart_product_price"></span>
                            </span>
                            <span>
                                <span id="currency" class="currency"></span>
                                <span id="sale_price" class="cartique_saleprice_price"></span>
                            </span>
                        </div>
                    </div>
                </div>
                <div class="cart-item-row">
                    <div class="cart-item-quantity">
                        <button class="decrease-qty qty-btn">-</button>
                        <input type="text" class="quantity" value="1" readonly />
                        <button class="increase-qty qty-btn">+</button>
                    </div>
                    <div class="cart-item-remove">
                        <button class="remove-btn" id="remove-item">&times;</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Sidebar -->
        <div id="cartique-sidebar-component">
            <div id="cartique-filter-sidebar"></div>
        </div>

        <!-- Search -->
        <div id="cartique-search-container-component">
            <div class="search-container">
                <input type="text" id="cartique-search" class="cartique-search" placeholder="Search..." />
            </div>
        </div>

        <!-- Sort -->
        <div id="cartique-sort-container-component">
            <div class="sort-container">
                <select class="cartique-sort">
                    <option value="">Sort Products</option>
                    <option value="price-asc">Price: Low to High</option>
                    <option value="price-desc">Price: High to Low</option>
                    <option value="title-asc">Title: A to Z</option>
                    <option value="title-desc">Title: Z to A</option>
                </select>
            </div>
        </div>

        <!-- View Toggles -->
        <div id="cartique-view-toggles-container-component">
            <div class="cartique-view-toggles">
                <button class="cartique-view-toggle cartique-grid-view" aria-label="Grid View">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
                        <path d="M3 3h7v7H3zm0 11h7v7H3zm11-11h7v7h-7zm0 11h7v7h-7z"/>
                    </svg>
                </button>
                <button class="cartique-view-toggle cartique-list-view" aria-label="List View">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
                        <path d="M3 6h18V4H3zm0 6h18V10H3zm0 6h18V16H3z"/>
                    </svg>
                </button>
            </div>
        </div>

        <!-- Footer -->
        <div id="cartique-product-footer-component">
            <div>Products Footer</div>
        </div>
    </div>

    <script type="importmap">
    {
        "imports": {
            "@semantq/cartique": "../../../cartique.js"
        }
    }
    </script>
    <script type="module" src="./app.js"></script>
</body>
</html>
