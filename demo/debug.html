<!DOCTYPE html>
<html>
<head>
    <title>Debug VariantResolver</title>
</head>
<body>
    <h1>Debug: VariantResolver</h1>
    <pre id="output"></pre>

    <script type="importmap">
    {
        "imports": {
            "@semantq/cartique": "../src/index.js"
        }
    }
    </script>
    <script type="module">
        import { ResolutionEngine } from '../src/engine/ResolutionEngine.js';
        import { VariantResolver } from '../src/engine/resolvers/VariantResolver.js';
        import { PricingResolver } from '../src/engine/resolvers/PricingResolver.js';
        import { PromotionResolver } from '../src/engine/resolvers/PromotionResolver.js';
        import { TaxResolver } from '../src/engine/resolvers/TaxResolver.js';
        import { ShippingResolver } from '../src/engine/resolvers/ShippingResolver.js';
        import { Customer, Place } from '../src/commerce/index.js';
        import { products } from './products.js';

        const kernel = new ResolutionEngine({
            resolvers: [
                new VariantResolver(),
                new PricingResolver(),
                new PromotionResolver(),
                new TaxResolver(),
                new ShippingResolver()
            ]
        });

        const product = products[0];
        const variant = product.variants[0];
        const variantId = variant.id;

        console.log('Product:', product.title);
        console.log('Variant:', variant);
        console.log('Variant ID:', variantId);

        const result = await kernel.resolve({
            sellable: product,
            customer: Customer.retail({ id: 'demo' }),
            place: Place.southAfrica(),
            configuration: {
                quantity: 1,
                selections: {
                    variantId: variantId
                }
            },
            contexts: []
        });

        document.getElementById('output').textContent = JSON.stringify({
            variantId: variantId,
            journal: result.journal.entries,
            resolved: result.resolved
        }, null, 2);

        console.log('Result:', result);
    </script>
</body>
</html>
